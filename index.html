function reportShift(n){let d=parse(reportMonth+'-01');d.setMonth(d.getMonth()+n);reportMonth=date(d).slice(0,7);forecastDays=[];forecastLessons=0;render()}
function reportNow(){reportMonth=today.slice(0,7);forecastDays=[];forecastLessons=0;render()}
function stats(m=reportMonth){let p=0,a=0,e=0,u=0,f=0; const [first,last]=monthBounds(m); for(let d=first; d<=last; d=add(d,1)){ if(compareMonth(d.slice(0,7),today.slice(0,7))>0 || (m===today.slice(0,7) && d>today)) {f+=count(d); continue;} for(const mark of marks(d)){ if(mark==='p')p++; else if(mark==='a')a++; else if(mark==='e')e++; else u++; } } let n=p+a+(s.excused?0:e), pct=n?p/n*100:null; return {p,a,e,u,f,n,pct,buffer:Math.max(0,Math.floor(p/(s.target/100)-n+1e-9)),recover:Math.max(0,Math.ceil((s.target/100*n-p)/(1-s.target/100)-1e-9))} }
function fillBefore(d){for(let x=d.slice(0,7)+'-01';x<d&&x<=today;x=add(x,1)){if(!count(x))continue; s.marks[x]??=[]; for(let i=0;i<count(x);i++) if(!s.marks[x][i]) s.marks[x][i]='p';}}
function setMark(d,i,v){if(d>today)return; s.marks[d]??=[]; const next=s.marks[d][i]===v?'':v; if(next) fillBefore(d); s.marks[d][i]=next; save();}
function markAllLessons(v){if(selected>today)return; if(v) fillBefore(selected); s.marks[selected]=Array(count(selected)).fill(v); save();}
function changeMonth(n){let d=parse(month+'-01'); d.setMonth(d.getMonth()+n); month=date(d).slice(0,7); render();}
function choose(d){selected=d; month=d.slice(0,7); render();}
function override(d,v){s.over[d]=limit(v); save();}
function resetDay(d){delete s.over[d]; save();}
function setPage(p){const old=page; page=p; render(); const btn=$('nav').querySelector(`button[data-page="${p==='schedule'?'settings':p}"]`); if(btn){btn.classList.remove('tab-pop'); void btn.offsetWidth; btn.classList.add('tab-pop');} if(old!==p){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});} }
function metric(v,l,c=''){return `<div class="stat-cell"><small>${l}</small><div class="metric ${c}">${v}</div></div>`}
function stepper(v,fn,label,max=5){return `<div class="stepper" role="group" aria-label="${label}"><button aria-label="- ${label}" ${v<=0?'disabled':''} onclick="${fn}(${v-1})">−</button><b>${v}</b><button aria-label="+ ${label}" ${v>=max?'disabled':''} onclick="${fn}(${v+1})">+</button></div>`}
function setWeek(i,v){s.week[i]=limit(v); save();}
function jumpLessons(){document.getElementById('lesson-editor')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
function weekdayShort(d){return parse(d).toLocaleDateString(locales[sState.lang],{weekday:'short'})}
function calendar(){let first=month+'-01', offset=(parse(first).getDay()+6)%7, days=new Date(parse(first).getFullYear(),parse(first).getMonth()+1,0).getDate(); return `<div class="card"><div class="row"><button onclick="changeMonth(-1)">‹</button><b style="text-transform:capitalize">${fmtDate(first,{month:'long',year:'numeric'})}</b><button onclick="changeMonth(1)">›</button></div><div class="calendar">${t('weekday').map(x=>`<div class="dow">${x}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'), m=marks(d), p=m.includes('p'), a=m.some(x=>x==='a'||x==='e'); return `<button class="day ${d===selected?'selected':''} ${!count(d)?'off':p&&a?'mixed':a?'absent':p?'present':''}" onclick="choose('${d}')">${i+1}<small>${count(d)} ${t('lessonsShort')}</small></button>`}).join('')}</div></div>`}
function lessonsEditor(){return `<div id="lesson-editor" class="card live-pop"><h2>${fmtDate(selected)}</h2><div class="row"><small>${t('lessonsPlanned')}</small>${stepper(count(selected),`(v=>override('${selected}',v))`,t('lessons'))}</div>${s.over[selected]!==undefined?`<button onclick="resetDay('${selected}')">${t('backToDefault')}</button>`:''}${selected>today?`<p class="muted">${t('futureDay')}</p>`:`<div class="tabs"><button onclick="markAllLessons('p')">${t('allPresent')}</button><button onclick="markAllLessons('a')">${t('allMissed')}</button><button onclick="markAllLessons('')">${t('reset')}</button></div>${marks(selected).map((m,i)=>`<div class="lesson"><b>${i+1} ${t('lesson')}</b><div class="actions">${[['p',t('present'),'on'],['a',t('absent'),'bad'],['e',t('excusedShort'),'exc']].map(([v,l,c])=>`<button class="${m===v?c:''}" onclick="setMark('${selected}',${i},'${v}')">${l}</button>`).join('')}</div></div>`).join('')||`<p class="muted">${t('noLessons')}</p>`}`}</div>`}
function monthHistory(){const items=[]; let d=parse(reportMonth+'-01'); for(let i=1;i<=4;i++){ d.setMonth(d.getMonth()-1); const m=date(d).slice(0,7); const st=stats(m); const [first,last]=monthBounds(m); const missed=[]; for(let day=first; day<=last; day=add(day,1)){ const mm=marks(day); if(mm.some(x=>x==='a'||x==='e')) missed.push(parse(day).getDate()); }
 items.push({m,st,missed}); }
 return `<div class="card"><h2>${t('history')}</h2><p class="muted note">${t('historyDesc')}</p><div class="history-list">${items.map(it=>`<div class="history-item"><div class="history-top"><b>${fmtDate(it.m+'-01',{month:'long',year:'numeric'})}</b><span class="${it.st.pct!==null&&it.st.pct>=s.target?'good':'muted'}">${it.st.pct===null?'—':it.st.pct.toFixed(1)+'%'}</span></div><div class="history-days">${it.missed.length?`${t('missedDates')}: ${it.missed.join(', ')}`:t('noMissedDays')}</div></div>`).join('')}</div></div>`}
function getForecastDays(){const days=[]; const currentMonth=today.slice(0,7); if(compareMonth(reportMonth,currentMonth)<0) return days; const [first,last]=monthBounds(reportMonth); let start=reportMonth===currentMonth? today : first; if(start<first) start=first; for(let d=start; d<=last; d=add(d,1)){ if(count(d)>0) days.push(d); } return days; }
function toggleForecastDay(d){forecastDays=forecastDays.includes(d)?forecastDays.filter(x=>x!==d):[...forecastDays,d]; render();}
function forecastExtra(){ if(forecastMode==='lessons') return forecastLessons; return forecastDays.reduce((sum,d)=>sum+count(d),0); }
function forecastCard(st){const extra=forecastExtra(); const pct=st.n+extra ? (100*st.p/(st.n+extra)).toFixed(1)+'%' : '—'; const dayChoices=getForecastDays(); return `<div class="card"><h2>${t('forecast')}</h2><p class="muted note">${t('forecastDesc')}</p><div class="tabs"><button class="${forecastMode==='lessons'?'on':''}" onclick="forecastMode='lessons';render()">${t('byLessons')}</button><button class="${forecastMode==='days'?'on':''}" onclick="forecastMode='days';render()">${t('byDays')}</button></div>${forecastMode==='lessons'?`<div class="row"><small>${t('missMoreLessons')}</small>${stepper(forecastLessons,'setForecastLessons',t('forecast'))}</div>`:`<div><p class="muted note">${t('daysModeHelp')}</p>${dayChoices.length?`<div class="chips">${dayChoices.map(d=>`<button class="chip ${forecastDays.includes(d)?'on':''}" onclick="toggleForecastDay('${d}')">${weekdayShort(d)} ${parse(d).getDate()}</button>`).join('')}</div>`:`<p class="muted">${t('noFutureDays')}</p>`}</div>`}<div class="section-label">${t('afterForecast')}</div><div class="metric">${pct}</div><div class="row"><span>${t('leftThisMonth')}</span><b>${st.f} ${t('lessonsShort')}</b></div><div class="row"><span>${t('needRecover')}</span><b>${st.recover} ${t('lessonsShort')}</b></div></div>`}
function setForecastLessons(v){forecastLessons=limit(v); render();}
function schedulePage(){let start=mode==='week'?add(selected,-(parse(selected).getDay()+6)%7):month+'-01'; let length=mode==='week'?7:new Date(parse(start).getFullYear(),parse(start).getMonth()+1,0).getDate(); return `<button class="back" onclick="setPage('settings')">‹ ${t('settings')}</button><div class="card"><h2>${t('standardWeek')}</h2><small>${t('standardWeekDesc')}</small>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((_,i)=>`<div class="row"><span>${parse(add('2024-01-01',i)).toLocaleDateString(locales[sState.lang],{weekday:'long'})}</span>${stepper(s.week[i],`(v=>setWeek(${i},v))`,t('lessons'))}</div>`).join('')}<small>${t('totalWeek')}: ${s.week.reduce((a,b)=>a+b,0)}</small></div><div class="card"><h2>${t('customSchedule')}</h2><div class="tabs"><button class="${mode==='week'?'on':''}" onclick="mode='week';render()">${t('week')}</button><button class="${mode==='month'?'on':''}" onclick="mode='month';render()">${t('month')}</button></div><div class="row"><button onclick="shiftSchedule(-1)">‹</button><b>${fmtDate(start)}</b><button onclick="shiftSchedule(1)">›</button></div>${Array.from({length},(_,i)=>{let d=add(start,i); return `<div class="row"><span>${fmtDate(d,{weekday:'short',day:'numeric',month:'short'})}</span>${stepper(count(d),`(v=>override('${d}',v))`,t('lessons'))}<button onclick="resetDay('${d}')">↺</button></div>`}).join('')}</div>`}
function shiftSchedule(n){if(mode==='week'){selected=add(selected,n*7);month=selected.slice(0,7)}else{let d=parse(month+'-01');d.setMonth(d.getMonth()+n);month=date(d).slice(0,7);selected=month+'-01'}render()}
function backup(){let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})); a.download='vexi-backup.json'; a.click(); URL.revokeObjectURL(a.href)}
async function restore(el){try{let x=JSON.parse(await el.files[0].text()); if(!Array.isArray(x.week)||!x.over||!x.marks) throw Error(); s={...initial,...x}; s.week=s.week.map(limit); s.volume=Math.max(0,Math.min(200,Number(s.volume)||200)); sState.lang=s.lang||'ru'; save();}catch{alert(t('invalidBackup'))}}
function render(){document.documentElement.lang=sState.lang; document.body.className=s.theme==='light'?'light':''; document.querySelector('meta[name="theme-color"]').content=s.theme==='light'?'#eaf3fd':'#0b101b'; const st=stats(); const good=st.pct!==null&&st.pct>=s.target; const titleMap={home:t('attendance'),cal:t('calendar'),settings:t('settings'),schedule:t('schedule')}; document.title=`${dict[sState.lang].app} — ${titleMap[page]}`; if(!$('nav').querySelector('button')){$('nav').innerHTML='<div class="nav-indicator" aria-hidden="true"></div>'+[['home','nav-home',`<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,t('navHome')],['cal','nav-cal',`<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18"/><path class="cal-line" style="--delay:90ms" d="M7 14h4"/><path class="cal-line" style="--delay:180ms" d="M13 14h4"/><path class="cal-line" style="--delay:270ms" d="M7 17h4"/><path class="cal-line" style="--delay:340ms" d="M13 17h4"/></svg>`,t('navCal')],['settings','nav-settings',`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3v4l3 1 1 3 3 3h4l1-3 3-1 3-3v-4l-3-1-1-3-3-3z"/></svg>`,t('navSettings')]].map(([p,cls,ico,l])=>`<button class="${cls} ${p===page?'active':''}" data-page="${p}" onclick="setPage('${p}')"><span>${ico}</span>${l}</button>`).join(''); }
 const idx=['home','cal','settings'].indexOf(page==='schedule'?'settings':page); $('nav').style.setProperty('--tab',idx); [...$('nav').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active',i===idx));
 let html=`<header><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h4l3 8 3-8h4l-5.4 15h-3.2z" stroke="#11362f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div>${dict[sState.lang].app}</div></div><small>${fmtDate(today)}</small></header><h1>${titleMap[page]}</h1>`;
 if(page==='home'){
   html+=`<div class="card report-month"><div class="row"><button aria-label="prev" onclick="reportShift(-1)">‹</button><b>${fmtDate(reportMonth+'-01',{month:'long',year:'numeric'})}</b><button aria-label="next" onclick="reportShift(1)">›</button></div>${reportMonth!==today.slice(0,7)?`<button class="full" onclick="reportNow()">${t('thisMonth')}</button>`:''}</div>`;
   html+=`<div class="card hero"><small>${t('monthly')}</small><div class="ring" style="--p:${st.pct||0}%;${st.pct!==null&&!good?'--accent:#ff8994':''}"><div><strong>${st.pct===null?'—':st.pct.toFixed(1)+'%'}</strong><small>${t('minimum',{v:s.target})}</small></div></div><div class="status ${good?'good':'muted'}">${st.pct===null?t('firstMarks'):good?t('above'):t('below')}</div><div class="hero-actions"><button class="primary" onclick="choose(today);setPage('cal')">${t('openToday')}</button><button class="ghost" onclick="choose(reportMonth===today.slice(0,7)?today:reportMonth+'-01');setPage('cal')">${t('openMarks')}</button></div></div>`;
   html+=`<div class="section-label">${t('monthStats')}</div><div class="card"><div class="grid">${metric(st.p,t('attended'),'good')}${metric(st.a+(s.excused?0:st.e),t('missed'),'danger')}${metric(st.buffer,t('canMiss'))}${metric(st.u,t('unmarked'))}</div></div>`;
   if(st.u) html+=`<p class="muted note">${t('autoFillNote')}</p>`;
   html+=forecastCard(st);
   html+=monthHistory();
 } else if(page==='cal') {
   html+=calendar();
   html+=`<button class="primary full jump" onclick="jumpLessons()">${t('openSelected',{d:fmtDate(selected)})}</button>`;
   html+=lessonsEditor();
 } else if(page==='schedule') html+=schedulePage();
 else {
   html+=`<div class="card"><h2>${t('attendance')}</h2><p class="muted note">${t('selectedMonthOnly')}</p><div class="row"><span>${t('percentTarget')}</span><input type="number" min="1" max="99" value="${s.target}" onchange="s.target=Math.max(1,Math.min(99,Number(this.value)||80));save()"></div><div class="row"><span>${t('excusedRule')}</span><button class="switch ${s.excused?'on':''}" role="switch" aria-checked="${s.excused}" onclick="s.excused=!s.excused;save()"></button></div></div>`;
   html+=`<div class="card"><button class="settings-link" onclick="setPage('schedule')"><span>${t('scheduleSetup')}<small>${t('scheduleSetupDesc')}</small></span><b>›</b></button></div>`;
   html+=`<div class="card"><h2>${t('appearance')}</h2><div class="row"><span>${t('theme')}</span><select onchange="s.theme=this.value;save()"><option value="dark" ${s.theme==='dark'?'selected':''}>${t('dark')}</option><option value="light" ${s.theme==='light'?'selected':''}>${t('light')}</option></select></div><div class="row"><span>${t('language')}</span><select onchange="sState.lang=this.value;save()"><option value="ru" ${sState.lang==='ru'?'selected':''}>${t('russian')}</option><option value="de" ${sState.lang==='de'?'selected':''}>${t('german')}</option><option value="en" ${sState.lang==='en'?'selected':''}>${t('english')}</option></select></div></div>`;
   html+=`<div class="card"><h2>${t('sound')}</h2><div class="row"><span>${t('soundVolume')}</span><div style="display:flex;align-items:center;gap:10px"><input type="range" min="0" max="200" step="5" value="${s.volume}" oninput="s.volume=Number(this.value);save()"><b style="min-width:42px;text-align:right">${s.volume}%</b></div></div></div>`;
   html+=`<div class="card"><h2>${t('data')}</h2><p class="muted note">${t('dataLater')}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button onclick="backup()">${t('exportJSON')}</button><button onclick="document.getElementById('import').click()">${t('importJSON')}</button></div><input id="import" type="file" accept=".json" hidden onchange="restore(this)"></div>`;
 }
 $('app').innerHTML=html;
}
render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
function haptic(kind){try{if(document.visibilityState==='hidden')return;const tg=window.Telegram?.WebApp;const feedback=tg?.HapticFeedback;if(feedback&&tg.initData){if(kind==='confirm'){feedback.notificationOccurred('success');return;}if(kind==='delete'){feedback.notificationOccurred('warning');return;}if(kind==='toggle'||kind==='chart'||kind==='select'){feedback.selectionChanged();return;}feedback.impactOccurred(kind==='address'||kind==='open'?'medium':'light');return;}if(typeof navigator.vibrate!=='function')return;const pattern=kind==='delete'?[18,35,18]:kind==='confirm'?[12,25,16]:kind==='toggle'?12:kind==='chart'?7:kind==='address'?12:9;navigator.vibrate(pattern);}catch(e){}}
let audioContext;
function feedback(button){const navButtons=[...document.querySelectorAll('nav button')];const index=navButtons.indexOf(button);const frequencies=[620,740,540];haptic(index>=0||button.matches('input,select,[role=switch]')?'select':'tap');if((s.volume||0)<=0)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext ||= new Audio();const ctx=audioContext;function play(){if(ctx.state!=='running')return;const t=ctx.currentTime;const tone=ctx.createOscillator(),gain=ctx.createGain();tone.type='sine';const f=frequencies[index]||820;tone.frequency.setValueAtTime(f,t);tone.frequency.exponentialRampToValueAtTime(f*.58,t+.055);const vol=Math.max(.0001, .24*(s.volume/100));gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(vol,t+.004);gain.gain.exponentialRampToValueAtTime(.0001,t+.075);tone.connect(gain);gain.connect(ctx.destination);tone.start(t);tone.stop(t+.08);tone.onended=()=>{tone.disconnect();gain.disconnect()};}if(ctx.state==='running')play();else ctx.resume().then(play).catch(()=>{});}catch{}}
document.addEventListener('click',event=>{const button=event.target.closest?.('button');if(button&&!button.disabled)feedback(button)},true);
document.addEventListener('change',event=>{if(event.target.matches('select,input[type="number"],input[type="range"],input[type="file"]'))feedback(event.target)},true);
</script>
