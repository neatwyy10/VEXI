function fillBefore(d){for(let x=d.slice(0,7)+'-01';x<d&&x<=today;x=add(x,1)){if(!count(x))continue; s.marks[x]??=[]; for(let i=0;i<count(x);i++) if(!s.marks[x][i]) s.marks[x][i]='p';}}
function setMark(d,i,v){if(d>today||isHoliday(d))return; s.marks[d]??=[]; const next=s.marks[d][i]===v?'':v; if(next) fillBefore(d); s.marks[d][i]=next; save();}
function markAllLessons(v){if(selected>today||isHoliday(selected))return; if(v) fillBefore(selected); s.marks[selected]=Array(count(selected)).fill(v); save();}
function changeMonth(n){let d=parse(month+'-01'); d.setMonth(d.getMonth()+n); month=date(d).slice(0,7); render();}
function choose(d){selected=d; month=d.slice(0,7); render();}

function resetDay(d){delete s.over[d]; save();}
function setPage(p){const old=page; page=p; render(); const btn=$('nav').querySelector(`button[data-page="${p==='schedule'?'settings':p==='details'?'home':p}"]`); if(btn){btn.classList.remove('tab-pop'); void btn.offsetWidth; btn.classList.add('tab-pop');} if(old!==p){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});} }

function stepper(v,fn,label,max=8){return `<div class="stepper" role="group" aria-label="${label}"><button aria-label="- ${label}" ${v<=0?'disabled':''} onclick="${fn}(${v-1})">−</button><b>${v}</b><button aria-label="+ ${label}" ${v>=max?'disabled':''} onclick="${fn}(${v+1})">+</button></div>`}

function lessonsEditor(){if(isHoliday(selected))return `<div id="lesson-editor" class="card"><h2>${fmtDate(selected)}</h2><p class="muted">${t('holiday')}</p></div>`;return `<div id="lesson-editor" class="card live-pop"><h2>${fmtDate(selected)}</h2><p class="muted note">${t('unitHelp')}</p><div class="row"><small>${t('lessonsPlanned')}</small>${stepper(count(selected),`(v=>override('${selected}',v))`,t('lessons'))}</div>${s.over[selected]!==undefined?`<button onclick="resetDay('${selected}')">${t('backToDefault')}</button>`:''}${selected>today?`<p class="muted">${t('futureDay')}</p>`:`<div class="tabs"><button onclick="markAllLessons('p')">${t('allPresent')}</button><button onclick="markAllLessons('a')">${t('allMissed')}</button><button onclick="markAllLessons('')">${t('reset')}</button></div>${marks(selected).map((m,i)=>`<div class="lesson"><b>${t('unitNumber',{n:i+1})}</b><div class="actions">${[['p',t('present'),'on'],['a',t('absent'),'bad'],['e',t('excusedShort'),'exc']].map(([v,l,c])=>`<button class="${m===v?c:''}" onclick="setMark('${selected}',${i},'${v}')">${l}</button>`).join('')}</div></div>`).join('')||`<p class="muted">${t('noLessons')}</p>`}`}</div>`}
function monthHistory(){const items=[]; let d=parse(reportMonth+'-01'); for(let i=1;i<=4;i++){ d.setMonth(d.getMonth()-1); const m=date(d).slice(0,7); const st=stats(m); const [first,last]=monthBounds(m); const missed=[]; for(let day=first; day<=last; day=add(day,1)){ const mm=marks(day); if(mm.some(x=>x==='a'||x==='e')) missed.push(parse(day).getDate()); }

function toggleForecastDay(d){forecastDays=forecastDays.includes(d)?forecastDays.filter(x=>x!==d):[...forecastDays,d]; render();}
function forecastExtra(){ if(forecastMode==='lessons') return forecastLessons; return forecastDays.reduce((sum,d)=>sum+count(d),0); }
function forecastCard(st){const extra=forecastExtra(); const pct=st.n+extra ? (100*st.p/(st.n+extra)).toFixed(1)+'%' : '—'; const dayChoices=getForecastDays(); return `<div class="card"><h2>${t('forecast')}</h2><p class="muted note">${t('forecastDesc')}</p><div class="tabs"><button class="${forecastMode==='lessons'?'on':''}" onclick="forecastMode='lessons';render()">${t('byLessons')}</button><button class="${forecastMode==='days'?'on':''}" onclick="forecastMode='days';render()">${t('byDays')}</button></div>${forecastMode==='lessons'?`<div class="row"><small>${t('missMoreLessons')}</small>${stepper(forecastLessons,'setForecastLessons',t('forecast'))}</div>`:`<div><p class="muted note">${t('daysModeHelp')}</p>${dayChoices.length?`<div class="chips">${dayChoices.map(d=>`<button class="chip ${forecastDays.includes(d)?'on':''}" onclick="toggleForecastDay('${d}')">${weekdayShort(d)} ${parse(d).getDate()}<small class="forecast-unit">${t('unitCount',{n:count(d)})}</small></button>`).join('')}</div>`:`<p class="muted">${t('noFutureDays')}</p>`}</div>`}<p class="muted note">${t('forecastCount',{n:extra})}</p><div class="section-label">${t('afterForecast')}</div><div class="metric">${pct}</div><div class="row"><span>${t('leftThisMonth')}</span><b>${st.f} ${t('lessonsShort')}</b></div><div class="row"><span>${t('needRecover')}</span><b>${st.recover} ${t('lessonsShort')}</b></div></div>`}

function safeText(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function trendData(m){let p=0,n=0,points=[];const [first,last]=monthBounds(m);for(let d=first;d<=last&&d<=today;d=add(d,1)){let changed=false;for(const v of marks(d)){if(v==='p'){p++;n++;changed=true;}else if(v==='a'||(v==='e'&&!s.excused)){n++;changed=true;}}if(changed&&n)points.push({day:parse(d).getDate(),pct:100*p/n});}return points;}

function render(){document.documentElement.lang=sState.lang;document.body.dataset.accent=palette[s.accent]?s.accent:'mint'; document.body.className=s.theme==='light'?'light':''; document.querySelector('meta[name="theme-color"]').content=s.theme==='light'?'#eaf3fd':'#0b101b'; const st=stats(); const good=st.pct!==null&&st.pct>=s.target; const titleMap={home:t('attendance'),cal:t('calendar'),settings:t('settings'),schedule:t('schedule'),details:t('moreInfo')}; document.title=`${dict[sState.lang].app} — ${titleMap[page]}`; if(!$('nav').querySelector('button')||$('nav').dataset.lang!==sState.lang){$('nav').dataset.lang=sState.lang;$('nav').innerHTML='<div class="nav-indicator" aria-hidden="true"></div>'+[['home','nav-home',`<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>`,t('navHome')],['cal','nav-cal',`<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18"/><path class="cal-line" style="--delay:90ms" d="M7 14h4"/><path class="cal-line" style="--delay:180ms" d="M13 14h4"/><path class="cal-line" style="--delay:270ms" d="M7 17h4"/><path class="cal-line" style="--delay:340ms" d="M13 17h4"/></svg>`,t('navCal')],['settings','nav-settings',`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3v4l3 1 1 3 3 3h4l1-3 3-1 3-3v-4l-3-1-1-3-3-3z"/></svg>`,t('navSettings')]].map(([p,cls,ico,l])=>`<button class="${cls} ${p===page?'active':''}" data-page="${p}" onclick="setPage('${p}')"><span>${ico}</span>${l}</button>`).join(''); }
 const idx=['home','cal','settings'].indexOf(page==='schedule'?'settings':page==='details'?'home':page); $('nav').style.setProperty('--tab',idx); [...$('nav').querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active',i===idx));
 let html=`<header><div class="brand"><div class="logo"><img src="icon.png" alt="" width="30" height="30"></div><div>${dict[sState.lang].app}</div></div><small>${fmtDate(today)}</small></header><h1>${titleMap[page]}</h1>`;

function swatches(){return `<div class="swatches">${Object.entries(palette).map(([k,c],i)=>`<button class="swatch" style="background:${c}" aria-label="${accentNames[sState.lang][i]}" aria-pressed="${s.accent===k}" onclick="s.accent='${k}';save()">${s.accent===k?'✓':''}</button>`).join('')}</div>`}
function accentCard(){return `<div class="card"><h2>${t('accentColor')}</h2>${swatches()}</div>`}
let onboardStep=0,cloudLoading=false,lastOnboardStep=-1;
function renderOnboarding(){const previous=document.getElementById('onboard'), previousScroll=previous?.scrollTop||0;previous?.remove();if(s.onboarded||cloudLoading)return;const intro=lastOnboardStep<0,stepChanged=lastOnboardStep!==onboardStep, direction=onboardStep<lastOnboardStep?-18:18;lastOnboardStep=onboardStep;const panel=document.createElement('div');panel.id='onboard';panel.className='onboard'+(intro?' onboard-intro':'')+(stepChanged?' onboard-step':'');panel.style.setProperty('--onboard-direction',direction+'px');panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');const choices=['ru','de','en','fr'];const langs=['Русский','Deutsch','English','Français'];let body=onboardStep===0?`<h2>${t('chooseLanguage')}</h2><div class="tabs">${choices.map((l,i)=>`<button class="${sState.lang===l?'on':''}" onclick="sState.lang='${l}';s.lang='${l}';render()">${langs[i]}</button>`).join('')}</div>`:onboardStep===1?`<h2>${t('chooseWeek')}</h2><p class="muted note">${t('unitHelp')}</p>${Array.from({length:7},(_,i)=>`<div class="row"><span>${fmtDate(add('2024-01-01',i),{weekday:'long'})}</span>${stepper(s.week[i],`(v=>{s.week[${i}]=limit(v);render()})`,t('lessons'))}</div>`).join('')}<div class="row"><span>${t('percentTarget')}</span><input type="number" min="1" max="99" value="${s.target}" onchange="s.target=Math.max(1,Math.min(99,Number(this.value)||80));render()"></div>`:`<h2>${t('chooseLook')}</h2><div class="tabs"><button class="${s.theme==='dark'?'on':''}" onclick="s.theme='dark';render()">${t('dark')}</button><button class="${s.theme==='light'?'on':''}" onclick="s.theme='light';render()">${t('light')}</button></div>${swatches()}`;panel.innerHTML=`<div class="onboard-inner"><div class="brand"><div class="logo"><img src="icon.png" alt="" width="30" height="30"></div>Vexi</div><h1>${t('welcome')}</h1><p class="muted">${t('welcomeSub')}</p><div class="onboard-progress">${[0,1,2].map(i=>`<i class="${i<=onboardStep?'active':''}"></i>`).join('')}</div><div class="card">${body}</div><button class="primary" onclick="advanceOnboard()">${t(onboardStep===2?'startApp':'next')}</button>${onboardStep?'<button class="back" onclick="onboardStep--;render()">‹</button>':''}</div>`;document.body.append(panel);if(!stepChanged)panel.scrollTop=previousScroll;}
function advanceOnboard(){if(onboardStep<2){onboardStep++;render();return}s.onboarded=true;save();const app=$('app');app.classList.add('onboard-finished');app.addEventListener('animationend',()=>app.classList.remove('onboard-finished'),{once:true});setTimeout(()=>app.classList.remove('onboard-finished'),650);}
// Telegram account-scoped cloud backup. Two alternating slots prevent partial writes from replacing the last complete backup.
const tgCloud=window.Telegram?.WebApp;const cloud=tgCloud?.initData&&tgCloud?.isVersionAtLeast?.('6.9')?tgCloud.CloudStorage:null;
let cloudStatus=cloud?'syncing':'localOnly',cloudReady=false,cloudBusy=false,cloudDirty=false,cloudTimer,cloudSlot='a',cloudRevision=0;
function cloudCall(method,...args){return new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('timeout')),10000);try{cloud[method](...args,(err,value)=>{clearTimeout(timer);if(err||value===false)reject(Error(String(err||'failed')));else resolve(value)})}catch(e){clearTimeout(timer);reject(e)}})}
function cloudCard(){return `<div class="card"><h2>${t('cloud')}</h2><div id="cloud-status" class="cloud-status ${cloudStatus==='synced'?'ok':''}">${t(cloudStatus)}</div>${cloud?`<button style="margin-top:10px;padding:10px 14px" onclick="retryCloud()">${t('retrySync')}</button>`:''}</div>`}
function setCloudStatus(v){cloudStatus=v;const el=$('cloud-status');if(el){el.textContent=t(v);el.classList.toggle('ok',v==='synced')}}
function validCloud(x){return x&&Array.isArray(x.week)&&x.week.length===7&&x.over&&typeof x.over==='object'&&x.marks&&typeof x.marks==='object'}
async function readCloud(){let raw=await cloudCall('getItem','vexi_manifest');if(!raw)return null;const m=JSON.parse(raw);if(!['a','b'].includes(m.slot)||!Number.isInteger(m.parts)||m.parts<1||m.parts>500)throw Error('manifest');let parts=[];for(let i=0;i<m.parts;i+=40){const keys=Array.from({length:Math.min(40,m.parts-i)},(_,j)=>`vexi_${m.slot}_${i+j}`);const values=await cloudCall('getItems',keys);for(const k of keys){if(typeof values[k]!=='string'||!values[k])throw Error('missing');parts.push(values[k])}}const x=JSON.parse(parts.join(''));if(!validCloud(x))throw Error('invalid');cloudSlot=m.slot;cloudRevision=m.revision||0;return x}
async function initializeCloud(){if(!cloud)return;cloudLoading=!s.onboarded;render();setCloudStatus('syncing');try{const remote=await readCloud();if(remote){let same=JSON.stringify(remote)===JSON.stringify(s);let localHas=Object.keys(saved).length>0||s.onboarded;if(!same&&(!localHas||Number(remote.updatedAt||0)>Number(s.updatedAt||0)&&!cloudDirty||confirm(t('conflict')))){s={...initial,...remote};s.week=s.week.map(limit);s.haptics=true;s.onboarded=true;sState.lang=dict[s.lang]?s.lang:'ru';persistLocal();cloudDirty=false;}else if(!same){cloudDirty=true;}}else if(s.onboarded)cloudDirty=true;cloudReady=true;setCloudStatus('synced');}catch(e){setCloudStatus('offline');cloudReady=false;}finally{cloudLoading=false;render();if(cloudDirty&&cloudReady)queueCloud()}}
function queueCloud(){if(!cloud||!s.onboarded)return;cloudDirty=true;if(!cloudReady||cloudBusy)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,250);setCloudStatus('syncing')}
async function pushCloud(){if(!cloudReady||cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;try{const current=await cloudCall('getItem','vexi_manifest');if(current){const m=JSON.parse(current);if((m.revision||0)!==cloudRevision){cloudReady=false;cloudDirty=true;await initializeCloud();return;}}const payload=JSON.stringify(s),parts=payload.match(/[\s\S]{1,3000}/g)||['{}'];if(parts.length>500)throw Error('capacity');const slot=cloudSlot==='a'?'b':'a';for(let i=0;i<parts.length;i++)await cloudCall('setItem',`vexi_${slot}_${i}`,parts[i]);const rev=Math.max(Date.now(),cloudRevision+1);await cloudCall('setItem','vexi_manifest',JSON.stringify({slot,parts:parts.length,revision:rev}));cloudSlot=slot;cloudRevision=rev;setCloudStatus('synced')}catch(e){cloudDirty=true;setCloudStatus('offline')}finally{cloudBusy=false;if(cloudDirty&&cloudReady&&cloudStatus!=='offline')queueCloud()}}
function retryCloud(){if(cloudBusy)return;initializeCloud()}
window.addEventListener('online',()=>{if(cloud&&!cloudBusy)retryCloud()});

render();
initializeCloud();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
function haptic(kind){try{if(document.visibilityState==='hidden')return;const tg=window.Telegram?.WebApp;const feedback=tg?.HapticFeedback;if(feedback&&tg.initData){if(kind==='confirm'){feedback.notificationOccurred('success');return;}if(kind==='delete'){feedback.notificationOccurred('warning');return;}if(kind==='toggle'||kind==='chart'||kind==='select'||kind==='drag'){feedback.impactOccurred('medium');return;}feedback.impactOccurred('heavy');return;}if(typeof navigator.vibrate!=='function')return;const pattern=kind==='delete'?[18,35,18]:kind==='confirm'?[12,25,16]:kind==='toggle'||kind==='chart'||kind==='select'||kind==='drag'?20:30;navigator.vibrate(pattern);}catch(e){}}
let audioContext;
function feedback(button){const navButtons=[...document.querySelectorAll('nav button')];const index=navButtons.indexOf(button);const frequencies=[620,740,540];haptic(index>=0||button.matches('input,select,[role=switch]')?'select':'tap');if(!s.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext ||= new Audio();const ctx=audioContext;function play(){if(ctx.state!=='running')return;const t=ctx.currentTime;const tone=ctx.createOscillator(),gain=ctx.createGain();tone.type='sine';const f=frequencies[index]||820;tone.frequency.setValueAtTime(f,t);tone.frequency.exponentialRampToValueAtTime(f*.58,t+.055);const vol=Math.max(.0001, .24*(s.volume/100));gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(vol,t+.004);gain.gain.exponentialRampToValueAtTime(.0001,t+.075);tone.connect(gain);gain.connect(ctx.destination);tone.start(t);tone.stop(t+.08);tone.onended=()=>{tone.disconnect();gain.disconnect()};}if(ctx.state==='running')play();else ctx.resume().then(play).catch(()=>{});}catch{}}
document.addEventListener('click',event=>{const button=event.target.closest?.('button');if(button&&!button.disabled)feedback(button)},true);
document.addEventListener('change',event=>{if(event.target.matches('select,input[type="number"],input[type="range"],input[type="file"]'))feedback(event.target)},true);

// Touch and mouse are handled separately; keep ownership until release.
(()=>{const nav=$('nav');let drag=null,suppressUntil=0;
const buttons=()=>[...nav.querySelectorAll('button')];
const activeIndex=()=>Math.max(0,buttons().findIndex(b=>b.classList.contains('active')));
function begin(target,x,id,type){if(drag)return false;const b=target.closest?.('button');if(!b?.classList.contains('active'))return false;const bs=buttons();if(bs.length<2)return false;const step=bs[1].offsetLeft-bs[0].offsetLeft;if(!step)return false;const start=activeIndex();drag={id,type,x,step,start,last:start,moved:false,button:b};return true;}
function move(x){if(!drag)return;const dx=x-drag.x;if(!drag.moved&&Math.abs(dx)<4)return;if(!drag.moved){drag.moved=true;nav.classList.add('dragging')}const pos=Math.max(0,Math.min(drag.step*(buttons().length-1),drag.start*drag.step+dx));nav.style.setProperty('--drag-x',pos+'px');const i=Math.round(pos/drag.step);if(i!==drag.last){drag.last=i;haptic('drag')}}
function finish(cancel=false){if(!drag)return;const d=drag;drag=null;nav.classList.remove('dragging');nav.style.removeProperty('--drag-x');const i=cancel?d.start:d.last;nav.style.setProperty('--tab',i);if(cancel)return;if(d.moved){suppressUntil=Date.now()+450;if(i!==d.start){feedback(buttons()[i]);setPage(['home','cal','settings'][i]);}}else if(d.type==='touch'){suppressUntil=0;d.button.click();suppressUntil=Date.now()+350;}}
nav.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const f=e.changedTouches[0];if(begin(e.target,f.clientX,f.identifier,'touch'))e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>{if(drag?.type!=='touch')return;const f=[...e.touches].find(t=>t.identifier===drag.id);if(!f)return;if(e.cancelable)e.preventDefault();move(f.clientX);},{passive:false,capture:true});
document.addEventListener('touchend',e=>{if(drag?.type!=='touch')return;const f=[...e.changedTouches].find(t=>t.identifier===drag.id);if(!f)return;if(e.cancelable)e.preventDefault();move(f.clientX);finish();},{passive:false,capture:true});
document.addEventListener('touchcancel',e=>{if(drag?.type==='touch')finish(true);},{capture:true});
nav.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0)return;if(begin(e.target,e.clientX,e.pointerId,'pointer')){try{e.target.setPointerCapture(e.pointerId)}catch{}}});
window.addEventListener('pointermove',e=>{if(drag?.type==='pointer'&&drag.id===e.pointerId)move(e.clientX)});
window.addEventListener('pointerup',e=>{if(drag?.type==='pointer'&&drag.id===e.pointerId){move(e.clientX);finish()}});
window.addEventListener('pointercancel',e=>{if(drag?.type==='pointer'&&drag.id===e.pointerId)finish(true)});
window.addEventListener('blur',()=>finish(true));
nav.addEventListener('click',e=>{if(Date.now()<suppressUntil&&e.isTrusted){e.preventDefault();e.stopImmediatePropagation();}},true);
})();
</script>
</body>
